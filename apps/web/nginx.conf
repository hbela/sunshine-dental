# SPA + API reverse proxy. The browser only ever talks to this origin, so the
# better-auth session cookie stays first-party (SameSite=Lax) and there is no CORS.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API + better-auth calls to the api service on the compose network.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Propagate the original scheme from Traefik (https in production) so
    # better-auth issues Secure cookies.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # Static assets — long cache, they are content-hashed by Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback — every other path serves index.html for client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
