# SPA + API reverse proxy. The browser only ever talks to this origin, so the
# better-auth session cookie stays first-party (SameSite=Lax) and there is no CORS.
# Access log WITHOUT the query string: patient names/phones flow through API
# query params (?search=, ?patient_name=) and must not land in logs (GDPR).
log_format noargs '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/nginx/access.log noargs;

  # Security headers (the SPA is the only public surface; API is same-origin).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Proxy API + better-auth calls to the api service on the compose network.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Propagate the original scheme from Traefik (https in production) so
    # better-auth issues Secure cookies.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # Static assets — long cache, they are content-hashed by Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # PWA service worker + manifest must never be cached, so clients pick up
  # updates on the next launch (assets stay immutable above).
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { application/manifest+json webmanifest; }
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # SPA fallback — every other path serves index.html for client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
