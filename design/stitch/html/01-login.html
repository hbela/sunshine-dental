<!-- Header Section -->
<div class="text-center mb-10 space-y-2">
<h1 class="font-headline-lg text-[28px] md:text-headline-lg text-primary tracking-tight">Welcome back</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Sign in to Sunshine Dental</p>
</div>
<!-- Form Fields -->
<form class="w-full space-y-6" onsubmit="return false">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">Email</label>
<div class="relative group">
<input class="w-full h-14 bg-[#f2f4ed] border-0 rounded-xl px-4 text-on-surface font-body-lg text-body-lg focus:ring-0 focus:bg-primary-fixed slow-transition placeholder:text-outline/60" id="email" name="email" placeholder="you@clinic.com" type="email"/>
</div>
</div>
<!-- Password Field (In Focus State per prompt) -->
<div class="space-y-2">
<div class="flex justify-between items-end px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary-container hover:underline slow-transition" href="#">Forgot?</a>
</div>
<div class="relative">
<!-- Mocked FOCUS state via primary-fixed background as requested -->
<input autofocus="" class="w-full h-14 bg-primary-fixed border-0 rounded-xl px-4 text-on-surface font-body-lg text-body-lg ring-0 slow-transition" id="password" name="password" type="password" value="••••••••"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/70" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full h-14 signature-gradient text-on-primary font-title-md text-title-md rounded-full shadow-lg shadow-primary/10 hover:opacity-90 active:scale-[0.98] slow-transition flex items-center justify-center gap-2 group" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<!-- Secondary Actions -->
<div class="mt-8 flex items-center gap-6">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary slow-transition" href="#">Request Access</a>
<span class="w-1 h-1 rounded-full bg-outline-variant/30"></span>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary slow-transition" href="#">Support Center</a>
</div>
</div>
<!-- Language Switcher -->
<footer class="mt-8 flex items-center justify-center gap-4 text-label-md font-label-md tracking-widest text-on-surface-variant/60">
<button class="hover:text-primary slow-transition cursor-pointer text-primary font-bold">EN</button>
<span class="opacity-20">/</span>
<button class="hover:text-primary slow-transition cursor-pointer">HU</button>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                // Remove visual focus from all (to simulate explicit focus handling)
                document.querySelectorAll('input').forEach(i => i.classList.remove('bg-primary-fixed'));
                document.querySelectorAll('input').forEach(i => i.classList.add('bg-[#f2f4ed]'));
                
                // Add to current
                this.classList.remove('bg-[#f2f4ed]');
                this.classList.add('bg-primary-fixed');
            });
            
            input.addEventListener('blur', function() {
                if (this.id !== 'password') { // Keeping the password mocked focus for the prompt aesthetic
                    this.classList.remove('bg-primary-fixed');
                    this.classList.add('bg-[#f2f4ed]');
                }
            });
        });
    </script>
